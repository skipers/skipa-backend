spring:
  application:
    name: skipa-backend

  config:
    import: optional:file:.env[.properties]

  profiles:
    active: ${SPRING_PROFILES_ACTIVE}

  jackson:
    time-zone: Asia/Seoul

  data:
    web:
      pageable:
        max-page-size: 100

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  expiration:
    access: 600000       # 10분
    refresh: 604800000   # 7일

app:
  internal:
    api-key: ${INTERNAL_API_KEY:}
  ai-server:
    base-url: ${AI_SERVER_BASE_URL:http://localhost:8000}
    report-chat-path: ${AI_REPORT_CHAT_PATH:/reports/chat}
    pre-evaluation-chat-path: ${AI_PRE_EVALUATION_CHAT_PATH:/pre-evaluations/chat}
    portfolio-insights-path: ${AI_PORTFOLIO_INSIGHTS_PATH:/portfolio/insights}
  portfolio:
    insights-cache-ttl-seconds: ${PORTFOLIO_INSIGHTS_CACHE_TTL_SECONDS:86400}
  rabbitmq:
    exchange: ${RABBITMQ_EXCHANGE:skipa.exchange}
    report:
      queue: ${REPORT_GENERATE_QUEUE:skipa.report.generate}
      routing-key: ${REPORT_GENERATE_ROUTING_KEY:report.generate}
    patent-extract:
      queue: ${PATENT_EXTRACT_QUEUE:skipa.patent-extract}
      routing-key: ${PATENT_EXTRACT_ROUTING_KEY:patent.extract}
    pre-evaluation:
      queue: ${PRE_EVALUATION_GENERATE_QUEUE:skipa.pre-evaluation.generate}
      routing-key: ${PRE_EVALUATION_GENERATE_ROUTING_KEY:pre-evaluation.generate}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    public-endpoint: ${MINIO_PUBLIC_ENDPOINT:${MINIO_ENDPOINT:http://localhost:9000}}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:skipa}
    region: ${MINIO_REGION:us-east-1}
    presigned-url-expiry-seconds: ${MINIO_PRESIGNED_URL_EXPIRY_SECONDS:600}
