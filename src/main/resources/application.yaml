spring:
  application:
    name: skipa-backend

  config:
    import: optional:file:.env[.properties]

  profiles:
    active: ${SPRING_PROFILES_ACTIVE}

  jackson:
    time-zone: Asia/Seoul

  data:
    web:
      pageable:
        max-page-size: 100

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  expiration:
    access: 600000       # 10분
    refresh: 604800000   # 7일

app:
  internal:
    api-key: ${INTERNAL_API_KEY:}
  rabbitmq:
    report:
      exchange: ${REPORT_EXCHANGE:skipa.report.exchange}
      queue: ${REPORT_GENERATE_QUEUE:skipa.report.generate}
      routing-key: ${REPORT_GENERATE_ROUTING_KEY:report.generate}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_REPORT_BUCKET:skipa}
    region: ${MINIO_REGION:us-east-1}
    presigned-url-expiry-seconds: ${MINIO_PRESIGNED_URL_EXPIRY_SECONDS:600}
