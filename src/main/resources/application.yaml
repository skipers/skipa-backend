spring:
  application:
    name: skipa-backend

  config:
    import: optional:file:.env[.properties]

  profiles:
    active: ${SPRING_PROFILES_ACTIVE}

  jackson:
    time-zone: Asia/Seoul

  data:
    web:
      pageable:
        max-page-size: 100

  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET}
  expiration:
    access: 600000       # 10분
    refresh: 604800000   # 7일

app:
  internal:
    api-key: ${INTERNAL_API_KEY:}
