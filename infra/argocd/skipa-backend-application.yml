apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: team8-skipa-backend
  namespace: skala-argocd
spec:
  project: default
  source:
    repoURL: https://github.com/skipers/skipa-backend.git
    targetRevision: main
    path: infra/k8s/backend
  destination:
    server: https://kubernetes.default.svc
    namespace: skala3-finalproj-class2-team8
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false