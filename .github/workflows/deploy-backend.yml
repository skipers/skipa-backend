name: Deploy Backend

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'infra/k8s/backend/backend-deployment.yml'

permissions:
  contents: write

jobs:
  build-and-update-manifest:
    name: Build, Push, and Update Manifest
    runs-on: ubuntu-latest

    env:
      REGISTRY: amdp-registry.skala-ai.com
      PROJECT: skala3-finalproj-class2-team8
      IMAGE_NAME: skipa-backend
      DEPLOYMENT_FILE: infra/k8s/backend/backend-deployment.yml

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image variables
        run: |
          SHORT_SHA=${GITHUB_SHA::7}
          echo "IMAGE_TAG=dev-${SHORT_SHA}" >> $GITHUB_ENV
          echo "IMAGE=${REGISTRY}/${PROJECT}/${IMAGE_NAME}:dev-${SHORT_SHA}" >> $GITHUB_ENV
          echo "LATEST_IMAGE=${REGISTRY}/${PROJECT}/${IMAGE_NAME}:dev-latest" >> $GITHUB_ENV

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission for Gradle
        run: chmod +x ./gradlew

      - name: Build Spring Boot jar
        run: ./gradlew clean bootJar

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}
            ${{ env.LATEST_IMAGE }}

      - name: Update backend deployment image tag
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          deployment_file = Path(os.environ["DEPLOYMENT_FILE"])
          image = os.environ["IMAGE"]

          content = deployment_file.read_text()
          old_prefix = "          image: amdp-registry.skala-ai.com/skala3-finalproj-class2-team8/skipa-backend:"
          lines = content.splitlines()

          updated = []
          changed = False

          for line in lines:
              if line.startswith(old_prefix):
                  updated.append(f"          image: {image}")
                  changed = True
              else:
                  updated.append(line)

          if not changed:
              raise RuntimeError("Could not find backend image line in deployment manifest.")

          deployment_file.write_text("\\n".join(updated) + "\\n")
          PY

      - name: Commit and push manifest update
        run: |
          if git diff --quiet; then
            echo "No manifest changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "${DEPLOYMENT_FILE}"
          git commit -m "chore: update backend image tag [skip ci]"
          git push